<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Terra Fértil · Acompanhamento do projeto</title>
<meta name="description" content="Acompanhamento semanal do projeto de tráfego e atribuição de leads da Terra Fértil.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2301152d'/%3E%3Cpath d='M9 22V10h14M16 10v12' stroke='%2302a13a' stroke-width='3.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..600&display=swap">
<style>
:root{
  --navy:#01152d; --green:#02a13a; --green-dark:#046b40;
  --ink:#01152d; --ink-soft:#526174; --ink-faint:#788592;
  --line:#dfe5e8; --line-strong:#bdc8ce; --paper:#f8faf9; --white:#fff; --chip:#f1f4f3;
  --alert:#a8480b;
  --radius-small:4px; --radius-medium:10px;
  --font:'Instrument Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;min-width:320px;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0} h1,h2,h3{line-height:1.15} ul,ol{margin:0;padding:0}
a{color:var(--green-dark)}
a:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:4px;border-radius:var(--radius-small)}
.wrap{width:min(calc(100% - 40px),1120px);margin-inline:auto}
.hero{padding:32px 0 48px;background:var(--white);border-top:4px solid var(--green)}
.header-brand{display:flex;align-items:center;gap:16px;margin-bottom:40px}
.header-brand .sep{width:1px;height:24px;background:var(--line)}
.logo-tf{display:block;height:28px;width:auto;color:var(--navy)}
.eyebrow,.owner,.asked,.status,h3,.phase-list em{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.eyebrow{color:var(--ink-soft)}
.header-title{display:grid;gap:16px}
h1{max-width:15ch;font-size:clamp(32px,5vw,48px);font-weight:500;letter-spacing:-.035em;text-wrap:balance}
.date{color:var(--ink-soft);font-size:14px}
section{padding:64px 0;border-top:1px solid var(--line)}
h2{margin-bottom:40px;font-size:clamp(24px,3vw,30px);font-weight:500;letter-spacing:-.025em}
.phase-list{position:relative;display:grid;margin-bottom:40px;list-style:none}
.phase-list::before{content:'';position:absolute;top:16px;bottom:16px;left:15px;width:1px;background:var(--line-strong)}
.phase-list li{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:16px;padding-bottom:32px}
.phase-list li:last-child{padding-bottom:0}
.phase-marker{z-index:1;display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line-strong);border-radius:50%;background:var(--paper);color:var(--ink-soft);font-size:12px;font-weight:600}
.phase-list .done .phase-marker{border-color:var(--navy);background:var(--navy);color:var(--white)}
.phase-list .current .phase-marker{border-color:var(--green);background:var(--green);color:var(--white);box-shadow:0 0 0 5px var(--paper)}
.phase-copy{padding-top:4px;min-width:0}
.phase-list em{display:block;margin-bottom:8px;color:var(--green-dark);font-style:normal}
.phase-list strong{display:block;margin-bottom:6px;font-size:17px;font-weight:600;letter-spacing:-.01em}
.phase-list p,.closes,.week-grid p,.task-list p{max-width:65ch}
.phase-list p{color:var(--ink-soft);font-size:15px}
.closes{padding-left:16px;border-left:2px solid var(--green);font-size:17px;font-weight:500;line-height:1.55}
.week-grid{display:grid}
.week-grid article{padding:24px 0;border-top:1px solid var(--line);min-width:0}
.week-grid h3{display:flex;align-items:center;gap:8px;margin-bottom:16px;color:var(--ink-soft)}
.week-grid h3::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.week-grid .done h3{color:var(--green-dark)} .week-grid .blocked h3{color:var(--alert)} .week-grid .next h3{color:var(--navy)}
.task-list{display:grid;gap:16px;list-style:none}
.task-list li{display:grid;gap:12px;padding:20px 24px;border:1px solid var(--line);border-radius:var(--radius-medium);background:var(--white);box-shadow:0 1px 2px rgb(1 21 45 / 4%);transition:border-color 150ms ease;min-width:0}
.task-list .status{justify-self:start}
.task-list li:hover{border-color:var(--line-strong)}
.task-main{display:grid;gap:6px;min-width:0}
.task-meta{display:flex;flex-wrap:wrap;gap:8px 16px}
.task-main strong{max-width:65ch;font-size:17px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.task-list p{font-size:15px}
.owner,.asked,.task-list p{color:var(--ink-soft)}
.status{display:inline-flex;flex:none;align-items:center;gap:8px;width:max-content;padding:5px 8px;border-radius:var(--radius-small);background:var(--chip);color:var(--ink-soft);white-space:nowrap}
.status::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.status.pending{color:var(--alert)} .status.received{color:var(--green-dark)} .status.prep{color:var(--ink-soft)}
.deliveries a{font-weight:500;text-decoration-thickness:1px;text-underline-offset:4px}
.deliveries .nolink{color:var(--ink-faint);font-size:14px}
footer{padding:32px 0 40px;border-top:1px solid var(--line);color:var(--ink-faint);font-size:14px}
.footer-inner,.signature{display:flex;align-items:center}
.footer-inner{justify-content:space-between;gap:24px}
.signature{gap:10px}
.logo-regua{height:18px;width:auto;flex:none;color:var(--ink-faint);opacity:.75}
.contact{color:var(--ink-soft);user-select:text;-webkit-user-select:text}
@media (min-width:960px){
  .hero{padding:36px 0 56px}
  .header-title{grid-template-columns:repeat(12,1fr);align-items:end;gap:24px}
  h1{grid-column:1 / span 8}
  .date{grid-column:9 / -1;justify-self:end;padding-bottom:6px;text-align:right}
  section{padding:80px 0}
  section>.wrap{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));column-gap:24px}
  section h2{grid-column:1 / span 3;align-self:start;margin:0;padding-top:1px;font-size:22px}
  .phase-list{grid-column:4 / -1;grid-template-columns:repeat(4,1fr);gap:24px}
  .phase-list::before{top:15px;right:calc(12.5% - 4px);bottom:auto;left:calc(12.5% - 4px);width:auto;height:1px}
  .phase-list li{grid-template-columns:1fr;justify-items:center;gap:16px;padding:0;text-align:center}
  .phase-copy{padding-top:0}
  .phase-list p{max-width:26ch}
  .closes{grid-column:4 / span 7}
  .week-grid{grid-column:4 / -1;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}
  .week-grid article{min-height:184px;padding:24px 32px;border-top:0;border-left:1px solid var(--line)}
  .week-grid article:first-child{padding-left:0;border-left:0}
  .week-grid article:last-child{padding-right:0}
  .task-list{grid-column:4 / -1;gap:12px}
  .task-list li{grid-template-columns:minmax(0,5fr) minmax(0,4fr) auto;column-gap:32px;align-items:start}
  .task-list .status{justify-self:end}
  .deliveries li{grid-template-columns:minmax(0,5fr) minmax(0,4fr) auto}
}
@media (max-width:480px){
  .wrap{width:calc(100% - 32px)}
  .header-brand{align-items:flex-start;flex-direction:column;gap:16px;margin-bottom:32px}
  .header-brand .sep{display:none}
  section{padding:56px 0}
  h2{margin-bottom:32px}
  .phase-list li{padding-bottom:40px}
  .week-grid article{padding:28px 0}
  .task-list li{padding:20px}
  .footer-inner{align-items:flex-start;flex-direction:column;gap:12px}
}
@media (prefers-reduced-motion:reduce){ .task-list li{transition:none} }
@media print{ .hero{border-top:0} section{padding:32px 0} .task-list li{box-shadow:none} }
</style>
</head>

<script>
/* =====================================================================
   CONTEÚDO PADRÃO (fallback). A página lê content.json ao lado dela; edite o JSON, não este bloco.
   1. updatedAt: a data por extenso.
   2. week: os três textos (Fechou, Travou, Próximo).
   3. dependencies: mude status para "Recebido" quando chegar; pode remover itens recebidos há mais de 2 semanas.
   4. deliveries: adicione a entrega da semana; status "Em preparação" ou "Entregue"; link quando houver.
   5. phases: mude current para a fase nova quando um gate fechar (done nas anteriores).
   ===================================================================== */
const content = {
  updatedAt: "Atualizado em sexta, 23 de outubro de 2026",

  week: {
    done: "Método de trabalho e rastreio do projeto montados. Acesso à conta de anúncios recebido. Leitura das campanhas atuais iniciada.",
    blocked: "Login do Wati ainda não chegou; sem ele, a parte do WhatsApp fica parada.",
    next: "Sexta 23/10: leitura completa das campanhas atuais — o que está acertando, o que está errando, o que o período de eleição distorce."
  },

  dependencies: [
    { title: "Login do Wati", owner: "Pedro", asked: "Pedido em 19/10", purpose: "Libera a investigação do lado do WhatsApp.", status: "Pendente" },
    { title: "Planilha de orgânico 2024 a out/2026", owner: "Pedro", asked: "Pedido em 19/10", purpose: "Base para separar pago de orgânico.", status: "Pendente" },
    { title: "Dicionário de status do ERP (o que conta como venda confirmada, cancelada, estornada)", owner: "Tiago, via Pedro", asked: "Pedido em 21/10", purpose: "Sem isso nenhum número de venda entra no diagnóstico.", status: "Pendente" }
  ],

  deliveries: [
    { title: "Leitura das campanhas atuais", date: "Sexta 23/10", status: "Em preparação", link: "" }
  ],

  phases: [
    { title: "Diagnóstico", detail: "Por que os números da Meta e do WhatsApp não batem.", current: true },
    { title: "Qualidade",   detail: "Que lead vale a pena e onde a venda é registrada." },
    { title: "Solução",     detail: "O que construir, só depois de provar o que falta." },
    { title: "Piloto",      detail: "Testar com orçamento e critério de parada." }
  ],
  closes: "Termina quando soubermos, com evidência, quanto do que chega no WhatsApp vem de anúncio e quanto não vem.",

  contact: "Vitor Botelho · (81) 95168-4016"
};
/* ===================== fim do bloco editável ===================== */

function render(content){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const statusClass = s => (s === "Recebido" || s === "Entregue") ? "received" : (s === "Pendente" ? "pending" : "prep");

  $("updatedAt").textContent = content.updatedAt;
  $("closes").textContent = content.closes;
  $("weekDone").textContent = content.week.done;
  $("weekBlocked").textContent = content.week.blocked;
  $("weekNext").textContent = content.week.next;
  $("contact").textContent = content.contact;

  const cur = content.phases.findIndex(p => p.current);
  $("phases").innerHTML = content.phases.map((p, i) => {
    const cls = i < cur ? "done" : (i === cur ? "current" : "");
    return `<li class="${cls}"${i === cur ? ' aria-current="step"' : ""}>
      <div class="phase-marker"><span>${i + 1}</span></div>
      <div class="phase-copy">${i === cur ? "<em>Fase atual</em>" : ""}<strong>${esc(p.title)}</strong><p>${esc(p.detail)}</p></div>
    </li>`;
  }).join("");

  $("dependencies").innerHTML = content.dependencies.map(d => `<li>
    <div class="task-main">
      <strong>${esc(d.title)}</strong>
      <div class="task-meta"><span class="owner">Responsável: ${esc(d.owner)}</span><span class="asked">${esc(d.asked)}</span></div>
    </div>
    <p>${esc(d.purpose)}</p>
    <span class="status ${statusClass(d.status)}">${esc(d.status)}</span>
  </li>`).join("");

  $("deliveries").innerHTML = content.deliveries.map(d => `<li>
    <div class="task-main"><strong>${esc(d.title)}</strong><span class="owner">${esc(d.date)}</span></div>
    <p>${d.link ? `<a href="${esc(d.link)}" target="_blank" rel="noopener">Abrir entrega</a>` : `<span class="nolink">O link entra aqui quando a entrega for publicada.</span>`}</p>
    <span class="status ${statusClass(d.status)}">${esc(d.status)}</span>
  </li>`).join("");
}
render(content);
fetch("content.json", {cache: "no-store"})
  .then(r => r.ok ? r.json() : Promise.reject(r.status))
  .then(data => { if (data && data.updatedAt && data.week && data.phases) render(data); })
  .catch(() => {});
</script>
